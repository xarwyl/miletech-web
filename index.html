<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поиск людей</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background: #f4f6f9;
      color: #20242a;
    }
    h1 { text-align: center; margin-bottom: 24px; }
    #search {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border: 1px solid #cbd2dc;
      border-radius: 10px;
      outline: none;
      background: #fff;
    }
    #search:focus {
      border-color: #6b7cff;
      box-shadow: 0 0 0 3px rgba(107,124,255,.15);
    }
    #results { margin-top: 20px; }
    .person {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      margin-bottom: 10px;
      background: #fff;
      border: 1px solid #e4e8ef;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(30, 45, 70, .06);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .person:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 14px rgba(30, 45, 70, .10);
    }
    .avatar {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #e9edf5;
      font-size: 25px;
    }
    .person-info { min-width: 0; }
    .full-name { display: block; font-size: 16px; line-height: 1.4; overflow-wrap: anywhere; }
    .person-id { margin-top: 4px; font-size: 12px; color: #7a8494; }
    mark {
      background: #ffeb80;
      color: inherit;
      border-radius: 3px;
      padding: 0 1px;
    }
    .empty { text-align: center; color: #777; padding: 18px 0; }
    @media (max-width: 480px) {
      body { margin: 16px auto; padding: 14px; }
      .person { padding: 12px; }
    }

    .toolbar { display: flex; gap: 10px; margin-top: 14px; }
    .toolbar button, .card-actions button, .form-actions button {
      border: 0; border-radius: 9px; padding: 10px 13px; cursor: pointer;
      font-size: 14px; font-weight: 600;
    }
    .add-btn { background: #536dfe; color: white; }
    .add-btn:hover { background: #4055d6; }
    .person { justify-content: space-between; }
    .person-main { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .card-actions { display: flex; gap: 7px; flex-shrink: 0; }
    .edit-btn { background: #edf0ff; color: #3446b5; }
    .delete-btn { background: #fff0f0; color: #b42318; }
    .editor {
      display: none; margin-top: 18px; padding: 18px; background: white;
      border: 1px solid #e4e8ef; border-radius: 12px;
      box-shadow: 0 2px 6px rgba(30,45,70,.06);
    }
    .editor.open { display: block; }
    .editor h2 { margin: 0 0 14px; font-size: 19px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-row label { display: block; font-size: 13px; color: #596273; }
    .form-row input {
      display: block; width: 100%; margin-top: 6px; padding: 11px 12px;
      border: 1px solid #cbd2dc; border-radius: 8px; font-size: 15px;
    }
    .form-actions { display: flex; gap: 8px; margin-top: 14px; }
    .save-btn { background: #198754; color: white; }
    .cancel-btn { background: #edf0f4; color: #333; }
    .notice { font-size: 12px; color: #687386; margin: 10px 0 0; }
    @media (max-width: 520px) {
      .person { align-items: flex-start; }
      .person-main { gap: 10px; }
      .card-actions { flex-direction: column; }
      .card-actions button { padding: 8px; }
      .form-row { grid-template-columns: 1fr; }
      .toolbar button { width: 100%; }
    }

  </style>
</head>
<body>
  <h1>Поиск людей</h1>
  <input type="text" id="search" placeholder="Введите фамилию или имя..." autocomplete="off">
  <div class="toolbar">
    <button class="add-btn" id="addPersonBtn" type="button">＋ Добавить человека</button>
  </div>
  <section class="editor" id="editor" aria-labelledby="editorTitle">
    <h2 id="editorTitle">Добавить человека</h2>
    <form id="personForm">
      <div class="form-row">
        <label>Фамилия
          <input id="surnameInput" name="surname" maxlength="100" required>
        </label>
        <label>Имя
          <input id="nameInput" name="name" maxlength="100" required>
        </label>
      </div>
      <div class="form-actions">
        <button class="save-btn" type="submit">Сохранить</button>
        <button class="cancel-btn" id="cancelEditBtn" type="button">Отмена</button>
      </div>
    </form>
    <p class="notice">Изменения сохраняются в этом браузере на этом устройстве.</p>
  </section>
  <div id="results" aria-live="polite"></div>

  <script>
    const searchInput = document.getElementById("search");
    const results = document.getElementById("results");
    const editor = document.getElementById("editor");
    const editorTitle = document.getElementById("editorTitle");
    const personForm = document.getElementById("personForm");
    const surnameInput = document.getElementById("surnameInput");
    const nameInput = document.getElementById("nameInput");
    const addPersonBtn = document.getElementById("addPersonBtn");
    const cancelEditBtn = document.getElementById("cancelEditBtn");

    let editingId = null;
    window.people = [];

    async function apiRequest(url, options = {}) {
      const response = await fetch(url, {
        headers: { "Content-Type": "application/json", ...(options.headers || {}) },
        ...options
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(payload.error || "Ошибка запроса к серверу");
      return payload;
    }

    async function loadPeople() {
      try {
        window.people = await apiRequest("/api/people");
        renderResults(searchPeople(searchInput.value), searchInput.value);
      } catch (error) {
        results.textContent = "Не удалось загрузить список. Проверьте, запущен ли сервер.";
        console.error(error);
      }
    }

    function searchPeople(query) {
      const normalized = query.trim().toLocaleLowerCase("ru");
      if (!normalized) return window.people;
      return window.people.filter(person =>
        `${person.surname} ${person.name}`.toLocaleLowerCase("ru").includes(normalized)
      );
    }

    function appendHighlightedText(element, text, query) {
      if (!query) {
        element.textContent = text;
        return;
      }
      const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const regex = new RegExp(escaped, "giu");
      let lastIndex = 0;
      let match;
      while ((match = regex.exec(text)) !== null) {
        element.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
        const mark = document.createElement("mark");
        mark.textContent = match[0];
        element.appendChild(mark);
        lastIndex = match.index + match[0].length;
        if (match[0].length === 0) regex.lastIndex++;
      }
      element.appendChild(document.createTextNode(text.slice(lastIndex)));
    }

    function openEditor(person = null) {
      editingId = person ? person.id : null;
      editorTitle.textContent = person ? "Редактировать человека" : "Добавить человека";
      surnameInput.value = person ? person.surname : "";
      nameInput.value = person ? person.name : "";
      editor.classList.add("open");
      surnameInput.focus();
      editor.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function closeEditor() {
      editor.classList.remove("open");
      personForm.reset();
      editingId = null;
    }

    function renderResults(found, query) {
      results.replaceChildren();

      if (!found.length) {
        const msg = document.createElement("p");
        msg.className = "empty";
        msg.textContent = "Ничего не найдено";
        results.appendChild(msg);
        return;
      }

      found.forEach(person => {
        const card = document.createElement("div");
        card.className = "person";

        const main = document.createElement("div");
        main.className = "person-main";
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.setAttribute("aria-hidden", "true");
        avatar.textContent = "👤";

        const info = document.createElement("div");
        info.className = "person-info";
        const fullName = document.createElement("strong");
        fullName.className = "full-name";
        appendHighlightedText(fullName, `${person.surname} ${person.name}`, query.trim());

        const id = document.createElement("div");
        id.className = "person-id";
        id.textContent = `ID: ${person.id}`;
        info.append(fullName, id);
        main.append(avatar, info);

        const actions = document.createElement("div");
        actions.className = "card-actions";
        const editBtn = document.createElement("button");
        editBtn.type = "button";
        editBtn.className = "edit-btn";
        editBtn.textContent = "Изменить";
        editBtn.addEventListener("click", () => openEditor(person));

        const deleteBtn = document.createElement("button");
        deleteBtn.type = "button";
        deleteBtn.className = "delete-btn";
        deleteBtn.textContent = "Удалить";
        deleteBtn.addEventListener("click", async () => {
          if (!confirm(`Удалить карточку «${person.surname} ${person.name}»?`)) return;
          try {
            await apiRequest(`/api/people/${person.id}`, { method: "DELETE" });
            window.people = window.people.filter(item => item.id !== person.id);
            renderResults(searchPeople(searchInput.value), searchInput.value);
          } catch (error) {
            alert(error.message);
          }
        });

        actions.append(editBtn, deleteBtn);
        card.append(main, actions);
        results.appendChild(card);
      });
    }

    addPersonBtn.addEventListener("click", () => openEditor());
    cancelEditBtn.addEventListener("click", closeEditor);

    personForm.addEventListener("submit", async event => {
      event.preventDefault();
      const surname = surnameInput.value.trim();
      const name = nameInput.value.trim();
      if (!surname || !name) {
        alert("Заполните имя и фамилию.");
        return;
      }

      try {
        if (editingId !== null) {
          const updated = await apiRequest(`/api/people/${editingId}`, {
            method: "PUT",
            body: JSON.stringify({ surname, name })
          });
          window.people = window.people.map(person => person.id === editingId ? updated : person);
        } else {
          const created = await apiRequest("/api/people", {
            method: "POST",
            body: JSON.stringify({ surname, name })
          });
          window.people.push(created);
        }
        closeEditor();
        renderResults(searchPeople(searchInput.value), searchInput.value);
      } catch (error) {
        alert(error.message);
      }
    });

    searchInput.addEventListener("input", () => {
      renderResults(searchPeople(searchInput.value), searchInput.value);
    });

    loadPeople();
  </script>
</body>
</html>
